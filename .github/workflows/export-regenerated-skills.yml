name: Sync generated agent skills

on:
  push:
    branches: ["feature/supabase-postgres-foundation"]
    paths:
      - ".github/workflows/export-regenerated-skills.yml"

permissions:
  contents: write

concurrency:
  group: generated-agent-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate and commit generated skills
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
      CI_NODE_VERSION: "24"
      DISABLE_SQLITE_AUTO_BACKUP: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/npm-ci-retry
        with:
          cache: true
      - name: Regenerate skill files from the source catalog
        run: node --import tsx/esm scripts/skills/generate-agent-skills.mjs --apply
      - name: Commit only generated skill changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills
          if git diff --cached --quiet; then
            echo "Generated skill files are already synchronized."
            exit 0
          fi
          git commit -m "chore(skills): regenerate stale agent skill files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
